name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest

    # A throwaway database so the Prisma store's real SQL is exercised, not just the
    # shared route logic against a fake store.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: karats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/karats_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/karats_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      - name: Unit and route tests
        run: npm test

      - name: Prisma store against Postgres
        run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/karats_test

  browser:
    name: Browser tests
    runs-on: ubuntu-latest

    # Empty channel selects Playwright's bundled Chromium instead of Edge, which is
    # what the README expects locally but is not present on the runner.
    env:
      PLAYWRIGHT_CHANNEL: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Offline, conflict and layout tests
        run: npm run test:browser

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
